name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ENG-01)
        run: npm run lint
      - name: Typecheck (ENG-01)
        run: npm run typecheck
      - name: Unit tests (ENG-02)
        run: npm test
      - name: Secrets scan (SEC-01, SEC-02)
        run: npm run scan
